<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tableau de bord — The Bureau</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --ink:#111827; --ink2:#374151; --mute:#6B7280; --line:#E5E7EB; --bg:#FFFFFF; --soft:#F9FAFB;
  --green:#15803D; --blue:#1D4ED8; --blue-l:#DBEAFE; --red:#B91C1C; --red-l:#FEE2E2; --orange:#C2410C; --orange-l:#FFEDD5;
  --yellow-l:#FEF9C3; --violet:#6D28D9; --grey:#4B5563;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--line);background:#fff}
.hbar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.spacer{flex:1}
.compte{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0 8px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;text-align:left;position:relative;transition:box-shadow .15s,border-color .15s;color:inherit}
.tile:hover{box-shadow:0 2px 10px rgba(17,24,39,.06);text-decoration:none}
.tile .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tile .n{font-size:30px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--mute);margin-top:6px}
.tile.on{border-width:2px;padding:15px 17px}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 13px 13px}
.tile.revalo .t,.tile.revalo .n{color:var(--green)} .tile.revalo.on{border-color:var(--green)} .tile.revalo .bar{background:var(--green)}
.tile.recouvrement .t,.tile.recouvrement .n{color:var(--red)} .tile.recouvrement.on{border-color:var(--red)} .tile.recouvrement .bar{background:var(--red)}
.tile.occupation .t,.tile.occupation .n{color:var(--blue)} .tile.occupation.on{border-color:var(--blue)} .tile.occupation .bar{background:var(--blue)}
.tile.clients .t,.tile.clients .n{color:var(--orange)} .tile.clients.on{border-color:var(--orange)} .tile.clients .bar{background:var(--orange)}
.tile.plan .t,.tile.plan .n{color:var(--grey)} .tile.plan.on{border-color:var(--grey)} .tile.plan .bar{background:#9CA3AF}
.tile .n.vide{color:var(--line)!important}

.etat{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0 6px;color:var(--mute);font-size:13px}
.etat b{color:var(--ink);font-size:14px}
.maj{display:inline-flex;align-items:center;gap:7px;color:var(--blue);background:var(--blue-l);border-radius:999px;padding:2px 11px 2px 6px}
.maj.ko{color:var(--red);background:var(--red-l);padding-left:11px}
.spin{width:13px;height:13px;border:2px solid #BFDBFE;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.info{background:var(--yellow-l);border:1px solid #FDE68A;color:#713F12;border-radius:10px;padding:9px 14px;font-size:13px;margin:8px 0}
.resume{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin:14px 0 10px}
.resume .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.resume .l{color:var(--mute);font-size:13px}
.outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:300px;max-width:100%}
.tri{color:var(--mute);font-size:13px}
.tri button{background:none;border:none;color:var(--ink2);padding:2px 6px;border-radius:6px;font-size:13px}
.tri button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.compteur{display:inline-flex;align-items:baseline;gap:3px;border-radius:10px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--orange-l);color:var(--orange)}
.compteur .v{font-size:22px;letter-spacing:-.02em}
.compteur.fort{background:var(--red-l);color:var(--red)}
.compteur.max{background:var(--red);color:#fff}
.sub{color:var(--mute);font-size:12.5px}
.client{font-weight:600}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mute);margin-left:6px;font-weight:400}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px;margin-top:2px}
details ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.relances .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.contact div{overflow-wrap:anywhere}
.montant{font-size:16px;font-weight:700}
.avoir{margin-top:6px;font-size:12.5px;color:var(--green);font-weight:600}
.avoir .sub{font-weight:400;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
.bientot{border:1px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--mute);margin:18px 0}
.bientot h2{color:var(--ink);font-size:19px;margin:0 0 6px}
.center{max-width:420px;margin:80px auto;text-align:center}
.center h2{margin:12px 0 6px;font-size:22px}
.center p{color:var(--mute)}
.big-spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto}
.form{text-align:left;margin-top:22px;display:grid;gap:10px}
.form label{font-size:12.5px;color:var(--mute)}
.form input,.form select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;background:#fff}
.err{color:var(--red);font-size:13px;min-height:18px}
@media (max-width:900px){ .tiles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:760px){
  .wrap{padding:0 16px}
  .tiles{gap:8px;margin:12px 0 6px}
  .tile{padding:9px 12px 11px}.tile.on{padding:8px 11px 10px}
  .tile .t{font-size:10.5px}.tile .n{font-size:20px;margin-top:2px}.tile .s{display:none}
  .search{width:100%}
  table.rec thead{display:none}
  table.rec,table.rec tbody{display:block;width:100%}
  table.rec tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  table.rec td{display:block;border:none;padding:4px 0;min-width:0}
  table.rec td.num{text-align:left}
  td.c-retard{order:1} td.c-montant{order:2;text-align:right} td.c-client{order:3;grid-column:1/-1}
  td.c-rel{order:4} td.c-contact{order:5}
  table.rec td.empty{grid-column:1/-1}
  table.rec td[data-l]::before{content:attr(data-l);display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  .deux{grid-template-columns:1fr}
}
/* occupation */
.titre{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:26px 0 8px}
.titre .sub{text-transform:none;letter-spacing:0;font-weight:400}
.tablewrap{overflow-x:auto}
table.synth td,table.synth th{padding:8px 10px;white-space:nowrap}
table.synth tr.total td{font-weight:700;border-top:2px solid var(--ink)}
table.bureaux td{padding:8px 10px}
td.pos{color:var(--green)} td.neg,.neg{color:var(--red)}
/* clients */
table.clients td{padding:10px;vertical-align:top}
.lien{background:none;border:none;padding:0;text-align:left;color:var(--ink)}
.lien.client{font-weight:600;font-size:14px}
.lien:hover{color:var(--blue)}
table.clients tr.ouvert td{border-bottom:none;background:var(--soft)}
table.clients tr.fiche-ligne td{padding:0 10px 14px;background:var(--soft)}
.fiche{padding:4px 2px;font-size:12.5px;display:grid;gap:4px}
.fiche div{overflow-wrap:anywhere}
table.contrats{margin-top:6px;background:#fff;border-radius:8px}
table.contrats td,table.contrats th{white-space:normal;font-size:12.5px}
tr.a-venir td{color:var(--green)}
/* revalorisation */
.n.neg{color:var(--red)} .n.pos{color:var(--green)}
.statut.rv-en_retard{background:var(--red-l);color:var(--red)}
.statut.rv-a_prevenir{background:var(--orange-l);color:var(--orange)}
.statut.rv-programmee{background:#DCFCE7;color:var(--green)}
.statut.rv-a_jour{background:var(--blue-l);color:var(--blue)}
.statut.rv-se_termine{background:#F3F4F6;color:var(--grey)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.statut{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.statut.libre{background:#F3F4F6;color:var(--grey)}
.statut.occupe{background:var(--blue-l);color:var(--blue)}
.statut.se_libere{background:var(--orange-l);color:var(--orange)}
.statut.arrive{background:#DCFCE7;color:var(--green)}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="brand">Tableau de bord<small>The Bureau · revalorisations, recouvrement, occupation</small></div>
  <div class="spacer"></div>
  <span class="compte" id="who"></span>
  <button class="btn" id="b-out" hidden>Se déconnecter</button>
</div></header>

<main class="wrap" id="main"><div class="center"><div class="big-spin"></div></div></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
<script type="module" src="js/tableau.js?v=20261127-8"></script>
</body>
</html>
