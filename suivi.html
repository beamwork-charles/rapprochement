<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Suivi niveau 5 — The Bureau</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --ink:#111827; --ink2:#374151; --mute:#6B7280; --line:#E5E7EB; --bg:#FFFFFF; --soft:#F9FAFB;
  --green:#15803D; --blue:#1D4ED8; --blue-l:#DBEAFE; --red:#B91C1C; --red-l:#FEE2E2; --orange:#C2410C; --orange-l:#FFEDD5; --yellow-l:#FEF9C3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input{font:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--line);background:#fff}
.hbar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.spacer{flex:1}
.compte{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}
[hidden]{display:none!important}
.etat{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0 6px;color:var(--mute);font-size:13px}
.etat b{color:var(--ink);font-size:14px}
.maj{display:inline-flex;align-items:center;gap:7px;color:var(--blue);background:var(--blue-l);border-radius:999px;padding:2px 11px 2px 6px}
.maj.ko{color:var(--red);background:var(--red-l);padding-left:11px}
.spin{width:13px;height:13px;border:2px solid #BFDBFE;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.info{background:var(--yellow-l);border:1px solid #FDE68A;color:#713F12;border-radius:10px;padding:9px 14px;font-size:13px;margin:8px 0}
.resume{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin:14px 0 10px}
.resume .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.resume .l{color:var(--mute);font-size:13px}
.outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:300px;max-width:100%}
.tri{color:var(--mute);font-size:13px}
.tri button{background:none;border:none;color:var(--ink2);padding:2px 6px;border-radius:6px;font-size:13px}
.tri button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.compteur{display:inline-flex;align-items:baseline;gap:3px;border-radius:10px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--orange-l);color:var(--orange)}
.compteur .v{font-size:22px;letter-spacing:-.02em}
.compteur.fort{background:var(--red-l);color:var(--red)}
.compteur.max{background:var(--red);color:#fff}
.sub{color:var(--mute);font-size:12.5px}
.client{font-weight:600}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mute);margin-left:6px;font-weight:400}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px;margin-top:2px}
details ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.relances .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.contact div{overflow-wrap:anywhere}
.montant{font-size:16px;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mute)}
.center{max-width:520px;margin:90px auto;text-align:center}
.center h2{margin:12px 0 6px;font-size:22px}
.center p{color:var(--mute)}
.big-spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto}
.form{text-align:left;margin-top:22px;display:grid;gap:10px}
.form input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.err{color:var(--red);font-size:13px;min-height:18px}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .search{width:100%}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  td{border:none;padding:5px 0}
  td.num{text-align:left}
  td[data-l]::before{content:attr(data-l);display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="brand">Suivi niveau 5<small>The Bureau · clients à relancer par les opérationnels</small></div>
  <div class="spacer"></div>
  <span class="compte" id="who"></span>
  <button class="btn" id="b-out" hidden>Se déconnecter</button>
</div></header>

<main class="wrap" id="main"><div class="center"><div class="big-spin"></div></div></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script type="module" src="js/suivi.js?v=20261126-11"></script>
</body>
</html>
